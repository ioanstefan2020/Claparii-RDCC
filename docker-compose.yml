services:
  primazi:
    build:
      context: .
      dockerfile: Dockerfile
    image: primazi:latest
    container_name: primazi-app
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
